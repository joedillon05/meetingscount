# Preview deployment of MeetingsCount on Fly.io.
#
#   fly launch --no-deploy --copy-config --name <your-app-name> --region ord
#   fly volumes create mc_data --size 1 --region ord --yes
#   fly secrets set MC_SECRET_KEY=$(openssl rand -hex 32)
#   fly deploy
#
# Live: demo mode off, no seeding, and the app refuses to boot if either
# demo switch is turned back on. Staff sign in with a password, participants
# with a code sent by text, and /join takes real payments through Stripe.
# "Going live" in DEPLOY.md is the checklist that goes with this file.

app = "meetingscount-preview"
primary_region = "ord"            # Chicago, the closest region to Michigan

[build]

[env]
  MC_ENV = "production"            # refuses to boot if either switch below is on
  MC_DEMO = "0"                    # no demo accounts on the sign-in screen, no codes on screen
  MC_DEV_AUTH = "0"                # no header shortcut: sign-in is real
  MC_SEED_ON_BOOT = "0"            # never put the demo county into a live database
  MC_DIRECTORY_FILE = "data/semi-aa-meetings-2026-01-28.csv"   # the meeting directory, first boot only
  MC_DATABASE_URL = "sqlite:////data/meetingscount.db"
  MC_PIN_RETENTION_DAYS = "30"
  MC_PUBLIC_URL = "https://actionscountplus.com"   # links in texts, webhook checks, www redirect
  MC_STRIPE_TRIAL_DAYS = "30"      # the first month free; the card is taken up front

[http_service]
  internal_port = 8000
  force_https = true              # phones only hand out GPS over https
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "mc_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[checks.health]
  type = "http"
  port = 8000
  path = "/healthz"
  interval = "30s"
  timeout = "3s"
  grace_period = "10s"
