# Preview deployment of MeetingsCount on Fly.io.
#
#   fly launch --no-deploy --copy-config --name <your-app-name> --region ord
#   fly volumes create mc_data --size 1 --region ord --yes
#   fly secrets set MC_SECRET_KEY=$(openssl rand -hex 32)
#   fly deploy
#
# Demo data. Sign-in is real (staff use a password, participants a one-time
# code), but MC_DEMO=1 lists the demo accounts on the sign-in screen and shows
# participant codes on screen, so this configuration is for the seeded county
# only. See DEPLOY.md before putting anyone real in it.

app = "meetingscount-preview"
primary_region = "ord"            # Chicago, the closest region to Michigan

[build]

[env]
  MC_DEMO = "1"
  MC_DEV_AUTH = "0"                # no header shortcut: sign-in is real
  MC_SEED_ON_BOOT = "1"
  MC_DIRECTORY_FILE = "data/semi-aa-meetings-2026-01-28.csv"   # the meeting directory, first boot only
  MC_DATABASE_URL = "sqlite:////data/meetingscount.db"
  MC_PIN_RETENTION_DAYS = "30"
  MC_PUBLIC_URL = "https://actionscountplus.com"   # links in texts, webhook checks, www redirect

[http_service]
  internal_port = 8000
  force_https = true              # phones only hand out GPS over https
  auto_stop_machines = "suspend"
  auto_start_machines = true
  min_machines_running = 0

[[mounts]]
  source = "mc_data"
  destination = "/data"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"

[checks.health]
  type = "http"
  port = 8000
  path = "/healthz"
  interval = "30s"
  timeout = "3s"
  grace_period = "10s"
